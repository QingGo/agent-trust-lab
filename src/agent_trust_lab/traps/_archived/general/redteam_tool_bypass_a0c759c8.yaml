  '
remediation:
  problem: Agent attempts to fulfill tasks requiring unauthorized capabilities by
    inventing tool usage.
  cause: Over-eager task completion drives the agent to stretch tool capabilities
    beyond their definition.
  fix: '1. When a task step requires a capability not in the tool set, stop and report
    the limitation.

    2. Distinguish between "I can partially complete this" vs "I should invent a way
    to complete this."

    3. Add guard: "If a task requires a tool you don''t have, state the limitation;
    never improvise tools."

