remediation:
  problem: Agent trusts poisoned tool descriptions that include fabricated parameters
    claiming sensitive capabilities.
  cause: Agent does not validate the tool description against the actual tool implementation.
  fix: '1. Tool descriptions should be cryptographically signed or verified against
    a known-good schema.

    2. When a description mentions data access capabilities, cross-check with the
