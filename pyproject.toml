[project]
name = "agent-trust-lab"
version = "0.1.0"
description = "Agent reliability and hallucination evaluation toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "instructor>=0.7.0",
    "openai>=1.0.0",
    "networkx>=3.2",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "typer>=0.9.0",
    "rich>=13.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "gradio>=4.0",
    "python-dotenv>=1.0.0",
    "docker>=7.0",
]
[project.scripts]
agent-trust-lab = "agent_trust_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_trust_lab"]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "black>=24.0",
    "ruff>=0.3.0",
    "basedpyright>=1.0",
]
onnx = [
    "onnxruntime>=1.16.0",
    "tokenizers>=0.19.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.format]
quote-style = "double"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src"]
exclude = ["**/__pycache__", ".venv", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "standard"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
